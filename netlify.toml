[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  port = 8888            # port gde će Netlify Dev pokretati Functions
  targetPort = 8081      # port gde frontend Vite radi (može biti 8081 ako je zauzet 5173)
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200